# AINGEL checks. No secrets are used and Meta is never called: tests that touch Meta intercept the HTTP client.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django) and real-Redis quotas
    runs-on: ubuntu-latest
    services:
      # A throwaway Redis for the quota tests (docs/REDIS_REAL_VALIDATION.md); never a production one.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - name: Migrations are complete
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
        run: python manage.py makemigrations --check --dry-run
      - name: Django test suite, including the real-Redis quota tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          PYTHONIOENCODING: utf-8
          AINGEL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          AINGEL_TEST_REDIS_ISOLATED: "1"
        run: python manage.py test -v 2
      - name: Container configuration checks
        run: python -m unittest discover -s deploy/tests -v

  web:
    name: Web (typecheck, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck && npm run build
      - name: Every test:* script
        working-directory: web
        run: |
          for script in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(s => s.startsWith('test:')).join(' '))"); do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done

  android:
    name: Android (unit tests, lint, debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

  desktop:
    name: AINGEL Desktop (.NET 8, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - working-directory: desktop
        run: dotnet build AingelDesktop.slnx -c Release
      - working-directory: desktop
        run: dotnet AingelDesktop.Tests/bin/Release/net8.0-windows/AingelDesktop.Tests.dll

  images:
    name: Docker images (build, Nginx start, backend as non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web image (nginx -t runs inside the build)
        run: docker build -f deploy/Dockerfile.web -t aingel-web:ci .
      - name: Build the backend image
        run: docker build -f deploy/Dockerfile.backend -t aingel-backend:ci .
      - name: The web container starts and serves the app
        run: |
          docker run -d --name aingel-web-ci -p 18080:8080 aingel-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/index.html; then break; fi
            sleep 1
          done
          grep -q '<div id="root">' /tmp/index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/any/client/route)" = "200"
          docker exec aingel-web-ci id -u | grep -qv '^0$'
          docker exec aingel-web-ci nginx -t
          docker logs aingel-web-ci
          docker rm -f aingel-web-ci
      - name: The backend image runs its code as UID 10001 (no root, files readable)
        run: |
          docker run --rm -e DJANGO_SECRET_KEY=ci-only-not-a-secret aingel-backend:ci sh -c \
            'test "$(id -u)" = 10001 && test -r /app/manage.py && test -r /web/src/components/aingel/signFingerprints.json && python manage.py check && python manage.py test assistance.test_screen_media assistance.test_expressions care.test_territory'
