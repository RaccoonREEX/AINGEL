# Local Unix sockets are confined to the database container and are needed
# during official-image initialization and for local administration.
local       all      all                         trust

# Reject non-TLS TCP before any allow rule, including the default image rules.
hostnossl   all      all      all                reject

# The application is the only TCP role/database; all unmatched traffic is denied.
hostssl     aingel   aingel   all                scram-sha-256
